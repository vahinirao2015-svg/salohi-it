<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${pageTitle})}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments :: nav}"></aside>
  <main class="main">
    <header class="top">
      <div>
        <p class="eyebrow">Time away</p>
        <h1 th:text="${pageTitle}">Request leave</h1>
      </div>
      <div class="who">
        <span th:text="${currentUser.fullName()}">Name</span>
        <form th:action="@{/logout}" method="post"><button class="linkish" type="submit">Sign out</button></form>
      </div>
    </header>
    <div th:replace="~{fragments :: alerts}"></div>
    <section class="panel">
      <form th:object="${leaveForm}" th:action="@{/leaves}" method="post">
        <label for="leaveType">Type</label>
        <select id="leaveType" th:field="*{leaveType}" required>
          <option value="">Choose</option>
          <option th:each="type : ${leaveTypes}" th:value="${type}" th:text="${type.label}">Casual</option>
        </select>
        <p class="field-error" th:if="${#fields.hasErrors('leaveType')}" th:errors="*{leaveType}"></p>
        <div class="grid-2">
          <div>
            <label for="startDate">From</label>
            <input id="startDate" type="date" th:field="*{startDate}" required/>
            <p class="field-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></p>
          </div>
          <div>
            <label for="endDate">To</label>
            <input id="endDate" type="date" th:field="*{endDate}" required/>
            <p class="field-error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></p>
          </div>
        </div>
        <label for="reason">Reason</label>
        <textarea id="reason" th:field="*{reason}" required></textarea>
        <p class="field-error" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></p>
        <div class="row" style="margin-top:18px">
          <button class="btn" type="submit">Submit request</button>
          <a class="btn secondary" th:href="@{/leaves}">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
